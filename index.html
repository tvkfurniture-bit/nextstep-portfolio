<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  
  <!-- SEO & Studio Metadata -->
  <title>NextStep | Technology Venture Portfolio & Founding Partner Portal</title>
  <meta name="description" content="NextStep Technology Studio. Explore proprietary business platforms, digital retail architectures, and apply as Founding Business Partner.">
  <meta name="theme-color" content="#060911">
  
  <!-- Social Share (OpenGraph) Metadata -->
  <meta property="og:title" content="NextStep | Technology Venture Portfolio & Partner Portal">
  <meta property="og:description" content="Explore proprietary business platforms and apply as Founding Business Partner.">
  <meta property="og:type" content="website">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060911;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Full-Screen Embedded Web App Frame */
    #nextstepFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #060911;
    }

    /* Branded Frosted Preloader */
    #loader {
      position: fixed;
      inset: 0;
      background: #060911;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .brand-loader {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .brand-loader span.highlight {
      color: #38bdf8;
    }

    .brand-loader span.badge {
      font-size: 11px;
      font-family: monospace;
      padding: 3px 7px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      margin-left: 6px;
      color: #94a3b8;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .loader-text {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 16px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Hide loader once page is loaded */
    .loaded #loader {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- NextStep Branded Loading Screen -->
  <div id="loader">
    <div class="brand-loader">
      <div class="logo-mark">❖</div>
      <div>NEXT<span class="highlight">STEP</span> <span class="badge">STUDIO</span></div>
    </div>
    <div class="spinner"></div>
    <div class="loader-text">Loading Venture Studio Platforms...</div>
  </div>

  <!-- Full-Screen Google Apps Script Web App Frame -->
  <iframe 
    id="nextstepFrame" 
    src="" 
    allow="clipboard-write; payment" 
    title="NextStep Venture Portfolio">
  </iframe>

  <script>
    /**********************************************************************************
     * ⚙️ CONFIGURATION: Paste your Google Apps Script Web App URL below
     **********************************************************************************/
    const APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyptMNopZArXFoMTiXdZFL6un3_db9jcTnLG2YNPfdCbE8T29BybmEVBC1R5hRDBI69/exec";

    // Forward any query parameters (like ?ref=1 or ?project=shopdigitize) into the iframe
    const currentParams = window.location.search;
    const targetUrl = APPS_SCRIPT_WEBAPP_URL + (currentParams ? (APPS_SCRIPT_WEBAPP_URL.includes('?') ? '&' : '?') + currentParams.slice(1) : '');

    const iframe = document.getElementById('nextstepFrame');
    iframe.src = targetUrl;

    // Remove preloader once Apps Script finishes loading
    iframe.onload = function() {
      document.body.classList.add('loaded');
    };

    // Fallback: Remove preloader after 2.5 seconds in case of slow network
    setTimeout(function() {
      document.body.classList.add('loaded');
    }, 2800);
  </script>
</body>
</html>
